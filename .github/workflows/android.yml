name: Build Android App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  build-aar:
    name: Build Go AAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.1.10909125" "platforms;android-34" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build AAR
        run: |
          make tools
          make aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: tsproxy-aar
          path: android-app/app/libs/tsproxy.aar

  build-apk:
    name: Build APK
    needs: build-aar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android SDK packages
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: tsproxy-aar
          path: android-app/app/libs/

      - name: Build debug APK
        run: make apk

      - name: Build release APK
        run: make release
        continue-on-error: true

      - name: List outputs
        run: find android-app/app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Rename APKs
        run: |
          for f in android-app/app/build/outputs/apk/debug/*.apk; do
            mv "$f" "$(dirname "$f")/tailscale-socks5-debug.apk"
          done
          for f in android-app/app/build/outputs/apk/release/*.apk; do
            mv "$f" "$(dirname "$f")/tailscale-socks5-release.apk"
          done 2>/dev/null || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-socks5-apk
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
